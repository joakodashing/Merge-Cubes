<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Cubes - Matter.js Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cargamos el motor de física Matter.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Marcador de puntuación flotante -->
    <div id="marcador">SCORE: <span id="puntos">0</span></div>

    <!-- Contenedor del próximo cubo -->
    <div id="previewContainer">
        <div>SIGUIENTE:</div>
        <div id="nextPreview"></div>
    </div>

    <!-- Botón de reinicio -->
    <button id="btnReset">Reiniciar Juego</button>

    <!-- Contenedor principal donde Matter.js dibujará el juego -->
    <div id="game-container"></div>

    <script src="script.js"></script>
</body>
</html>


  <script src="script.js"></script>
</body>
</html>
